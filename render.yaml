services:
    - type: web
      name: landmarks-frontend
      env: docker
      plan: free
      region: frankfurt
      dockerfilePath: ./Dockerfile
      envVars:
          - key: VITE_BACKEND_URL
            value: https://landmarks-backend.davidliviu.com
      buildCommand: |
          echo "Building with VITE_BACKEND_URL=$VITE_BACKEND_URL"
